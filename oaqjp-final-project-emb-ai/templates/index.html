<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 720px;">
        <h1 class="mb-1">Emotion Detector</h1>
        <p class="text-muted">
            Escribe una frase en inglés y descubre qué emoción predomina
            (anger, disgust, fear, joy, sadness).
        </p>

        <div class="card shadow-sm">
            <div class="card-body">
                <label for="textToAnalyze" class="form-label">Texto a analizar</label>
                <textarea id="textToAnalyze" class="form-control" rows="3"
                          placeholder="I love my life"></textarea>
                <button class="btn btn-primary mt-3" onclick="RunSentimentAnalysis()">
                    Analizar
                </button>
            </div>
        </div>

        <div id="system_response" class="alert alert-secondary mt-4" role="status">
            El resultado aparecerá aquí.
        </div>
    </main>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
